<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
            color: white;
            border: none;
            border-radius: 5px;
        }
        #btnHello {
            background-color: #4CAF50;
        }
        #btnHello:hover {
            background-color: #45a049;
        }
        #btnGoodbye {
            background-color: #f44336;
        }
        #btnGoodbye:hover {
            background-color: #da190b;
        }
    </style>
</head>
<body>
    <h1>Assignment 1</h1>
    <button id="btnHello">Xin chào</button>
    <button id="btnGoodbye">Tạm biệt</button>
    <script src="script.js"></script>
</body>
</html>
